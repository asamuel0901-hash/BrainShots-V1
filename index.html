<!DOCTYPE html>
<html>
<head>
  <title>BrainShots V1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
    button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; }
    #result { margin-top: 20px; padding: 15px; background: white; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <h2>🧠 BrainShots V1</h2>
  <p>Paste YouTube transcript below</p>
  <textarea id="text" rows="8" placeholder="Paste transcript here..."></textarea>
  <button onclick="summarize()">Summarize</button>
  <div id="result"></div>

  <script>
    const API_URL = '/api/summarize'; // Vercel magic - no full URL needed
    
    async function summarize() {
      const text = document.getElementById('text').value;
      const resultDiv = document.getElementById('result');
      
      if (!text) { alert('Paste transcript first bro'); return; }
      
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = 'Summarizing... ⏳';
      
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({text})
        });
        const data = await res.json();
        resultDiv.innerHTML = `<h3>Summary:</h3><p>${data.summary}</p>`;
      } catch (e) {
        resultDiv.innerHTML = 'Error: ' + e.message;
      }
    }
  </script>
</body>
  </html>
